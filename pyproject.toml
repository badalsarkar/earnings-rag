[project]
name = "earnings-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over earnings-call transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cohere>=7.0.0",
    "fastapi>=0.136.3",
    "lxml>=6.1.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.48.0",
    "yfinance>=1.4.0",
]

[project.scripts]
earnings-transcripts = "earnings_rag.transcripts.cli:main"
earnings-load = "earnings_rag.ingest.load:main"
earnings-embed = "earnings_rag.ingest.embed:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
